<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléchargement du rapport</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#f2f5f8; margin:0; padding:40px; color:#222; }
  .carte { max-width: 620px; margin: 0 auto; background:#fff; border-radius:8px;
           box-shadow:0 2px 10px rgba(0,0,0,.12); padding:28px 32px; text-align:center; }
  .icone { font-size:44px; }
  h1 { font-size:18px; color:#b00020; margin:12px 0 8px; }
  p { font-size:14px; color:#444; line-height:1.6; }
  .detail { font-size:12px; color:#888; background:#f6f6f6; padding:8px; border-radius:4px; margin-top:14px; word-break:break-word; }
  a { display:inline-block; margin-top:16px; background:#1F4E79; color:#fff;
      text-decoration:none; padding:9px 18px; border-radius:5px; font-weight:bold; font-size:13px; }
</style>
</head>
<body>
<div class="carte">
  <div class="icone">&#9888;</div>
  <h1>{{ message }}</h1>
  <p>{{ detail }}</p>
  <a href="/">Retour à l'accueil</a>
</div>
</body>
</html>
